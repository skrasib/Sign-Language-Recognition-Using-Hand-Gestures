[project]
name = "adaptive-hand-gesture-recognition"
version = "0.2.0"
description = "Adaptive real-time hand gesture recognition with online few-shot learning, open-set rejection, feedback adaptation, and dynamic DTW recognition."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
    "mediapipe==0.10.9",
    "numpy==1.26.2",
    "opencv-contrib-python==4.11.0.86",
    "pillow==10.1.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3,<9",
]
qt = [
    "pyside6>=6.11.1",
]

[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = ["adaptive_gesture*"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
addopts = "-q"

[tool.uv]
package = true
